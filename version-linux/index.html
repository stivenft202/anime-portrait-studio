<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Anime Half Portrait Studio — versión independiente</title>
<style>
  body { margin:0; background:#23272e; color:#e8e8e8; font-family:system-ui, sans-serif; display:flex; gap:16px; padding:16px; box-sizing:border-box; }
  #lienzo { background:#2c3038; height:92vh; aspect-ratio:3/4; }
  #panel { width:340px; }
  h1 { font-size:19px; margin:0 0 12px; }
  .fila { display:flex; align-items:center; gap:8px; margin:7px 0; }
  .fila span.etq { width:104px; font-size:12px; letter-spacing:.06em; color:#aeb6c2; }
  .fila b { flex:1; text-align:center; font-weight:600; font-size:14px; }
  .candado { background:transparent; padding:7px 8px; font-size:13px; line-height:1; }
  .candado:hover { background:#475061; }
  .candado.fijo { background:#8a6d2f; }
  .fila.fijo b { color:#ffd65a; }
  button { background:#39404d; color:#fff; border:0; border-radius:4px; padding:7px 12px; cursor:pointer; font-size:14px; }
  button:hover { background:#475061; }
  button.ancho { width:100%; margin:5px 0; padding:10px; }
  .sexo { display:flex; gap:8px; margin-bottom:10px; }
  .sexo button { flex:1; }
  .sexo button.activo { background:#8a6d2f; }
  #codigo { color:#f2c14e; font-family:monospace; margin-top:10px; font-size:14px; }
  #estado { color:#9fb4c8; font-size:13px; min-height:18px; }
</style>
</head>
<body>
<canvas id="lienzo" width="1200" height="1600"></canvas>
<div id="panel">
  <h1>PORTRAIT CREATOR</h1>
  <div class="sexo">
    <button id="btnF">Female</button><button id="btnM">Male</button>
  </div>
  <div id="filas"></div>
  <button class="ancho" id="btnAzar">Randomize</button>
  <button class="ancho" id="btnReset">Reset to Default</button>
  <button class="ancho" id="btnExportar">Export PNG</button>
  <button class="ancho" id="btnCara">Export Face PNG</button>
  <button class="ancho" id="btnGuardar">Save Recipe</button>
  <button class="ancho" id="btnCargar">Load Recipe</button>
  <input type="file" id="archivoReceta" accept=".json" style="display:none">
  <div id="codigo"></div>
  <div id="estado">Cargando capas…</div>
</div>
<script>
const EDADES = ["Young","Elderly"];
const PELOS = { Female:["Long Straight","Pixie Cut","Bob Cut","Long Wavy","Twin Tails","High Ponytail","Long Braid","Double Buns","Hime Cut","Messy Bun","Side Ponytail","Long Curly"], Male:["Style 1","Style 2","Style 3","Style 4"] };
const ROPAS = { Female:["Sweater and Jacket","Green Jacket","Blue Hoodie"], Male:["Outfit 1","Outfit 2","Outfit 3"] };
const OJOS = ["Neutral","Happy","Sad","Angry","Surprised"];
const NARICES = ["Nose 1","Nose 2","Nose 3"];
const VELLO = ["None","Mustache","Stubble","Full Beard"];
const BOCAS = { Female:["Neutral","Happy","Sad","Angry","Surprised"], Male:["Neutral","Happy","Surprised"] };
const ARCH = { pelo:i=>`Hair${i+1}`, ropa:i=>`Outfit${i+1}`, ojos:i=>["Eyes_Neutral","Eyes_Happy","Eyes_Sad","Eyes_Angry","Eyes_Surprised"][i],
               nariz:i=>`Nose${i+1}`, boca:(i,s)=>({Female:["Mouth_Neutral","Mouth_Happy","Mouth_Sad","Mouth_Angry","Mouth_Surprised"],Male:["Mouth_Neutral","Mouth_Happy","Mouth_Surprised"]}[s][i]) };
const COL_PELO = [["Natural Black",[.16,.15,.18]],["Dark Brown",[.36,.24,.17]],["Chestnut",[.55,.32,.18]],["Ash Blonde",[.85,.75,.55]],["Silver",[.82,.84,.88]],["Wine Red",[.55,.16,.20]],["Jet Black",[.08,.08,.10]],["Chocolate",[.42,.26,.16]],["Auburn",[.60,.28,.16]],["Copper",[.78,.42,.20]],["Burgundy",[.42,.12,.18]],["Crimson",[.72,.18,.18]],["Rose Pink",[.85,.45,.50]],["Golden Blonde",[.92,.78,.42]],["Honey",[.80,.60,.32]],["Platinum",[.95,.93,.88]],["Ash Gray",[.55,.56,.60]],["Navy Blue",[.16,.24,.48]],["Steel Blue",[.35,.48,.68]],["Teal",[.14,.42,.42]],["Forest Green",[.20,.38,.22]],["Mint",[.55,.80,.62]],["Plum",[.42,.22,.48]],["Lavender",[.62,.52,.78]]];
const PIEL = [["Light",[1,1,1]],["Warm",[.96,.85,.74]],["Tan",[.85,.66,.50]],["Deep",[.62,.45,.33]]];
const COL_ROPA = [["White",[1,1,1]],["Sand",[.92,.84,.70]],["Olive",[.62,.66,.48]],["Sky",[.62,.76,.92]],["Rose",[.94,.70,.72]],["Charcoal",[.35,.35,.38]],["Black",[.15,.15,.16]],["Gray",[.60,.60,.62]],["Navy",[.20,.28,.52]],["Royal Blue",[.30,.42,.85]],["Denim",[.42,.55,.72]],["Mint",[.62,.85,.70]],["Forest",[.30,.48,.32]],["Lime",[.72,.85,.45]],["Yellow",[.95,.85,.40]],["Orange",[.92,.58,.30]],["Coral",[.92,.55,.48]],["Red",[.78,.25,.25]],["Burgundy",[.50,.20,.26]],["Pink",[.95,.65,.78]],["Lavender",[.72,.65,.88]],["Purple",[.52,.38,.72]],["Brown",[.48,.36,.26]],["Camel",[.78,.62,.42]]];
const COL_OJOS = [["Original Green",null],["Brown",[110,68,40]],["Blue",[58,105,185]],["Amber",[185,128,48]],["Violet",[128,92,185]],["Gray",[128,132,138]],["Red",[175,42,38]]];

let R = { sexo:"Female", edad:0, pelo:0, ropa:0, ojos:0, nariz:0, boca:0, color_pelo:0, piel:0, color_ropa:0, color_ojos:0, vello:0 };
// Rasgos fijados: clave -> true. Un rasgo fijado NO cambia con Randomize
// (se cambia solo a mano, con < > o con los cuadritos de color). No forma
// parte de la receta (no se guarda en el JSON), es solo estado del panel.
let FIJOS = {};
let contador = 0, imgs = {};

function cargar(nombre){ return new Promise(res=>{ const i=new Image(); i.onload=()=>res(i); i.src=nombre; }); }
async function precargar(){
  for (const sexo of ["Female","Male"]){
    const lista = ["Base","Base_Elderly","Nose1","Nose2","Nose3","Eyes_Neutral","Eyes_Happy","Eyes_Sad","Eyes_Angry","Eyes_Surprised",
      "Mouth_Neutral","Mouth_Happy","Mouth_Surprised","Outfit1","Outfit2","Outfit3",
      "Hair1_Back","Hair1_Front","Hair2_Back","Hair2_Front","Hair3_Back","Hair3_Front","Hair4_Back","Hair4_Front",
      "Hair1_Back_Elderly","Hair1_Front_Elderly","Hair2_Back_Elderly","Hair2_Front_Elderly",
      "Hair3_Back_Elderly","Hair3_Front_Elderly","Hair4_Back_Elderly","Hair4_Front_Elderly"];
    if (sexo==="Male") lista.push("FacialHair1","FacialHair2","FacialHair3","FacialHair1_Elderly","FacialHair2_Elderly","FacialHair3_Elderly");
    if (sexo==="Female") lista.push("Hair5_Back","Hair5_Front","Hair6_Back","Hair6_Front","Hair7_Back","Hair7_Front","Hair8_Back","Hair8_Front","Hair9_Back","Hair9_Front","Hair10_Back","Hair10_Front","Hair11_Back","Hair11_Front","Hair12_Back","Hair12_Front");
    if (sexo==="Female") lista.push("Hair5_Back_Elderly","Hair5_Front_Elderly","Hair6_Back_Elderly","Hair6_Front_Elderly","Hair7_Back_Elderly","Hair7_Front_Elderly","Hair8_Back_Elderly","Hair8_Front_Elderly","Hair9_Back_Elderly","Hair9_Front_Elderly","Hair10_Back_Elderly","Hair10_Front_Elderly","Hair11_Back_Elderly","Hair11_Front_Elderly","Hair12_Back_Elderly","Hair12_Front_Elderly");
    if (sexo==="Female") lista.push("Mouth_Sad","Mouth_Angry");
    for (const n of lista) imgs[sexo+"/"+n] = await cargar(`assets/${sexo}/${n}.png`);
  }
  document.getElementById("estado").textContent = "";
  dibujar();
}
function teñida(img, tinte){
  const c = document.createElement("canvas"); c.width=1200; c.height=1600;
  const x = c.getContext("2d"); x.drawImage(img,0,0);
  if (tinte){ x.globalCompositeOperation="multiply";
    x.fillStyle=`rgb(${tinte.map(v=>Math.round(v*255)).join(",")})`; x.fillRect(0,0,1200,1600);
    x.globalCompositeOperation="destination-in"; x.drawImage(img,0,0); }
  return c;
}
const _ojosCache = {};
function ojosTeñidos(clave){
  const idx = R.color_ojos, img = imgs[clave];
  if (!idx || !img) return img;
  const ck = clave+"|"+idx;
  if (_ojosCache[ck]) return _ojosCache[ck];
  const W=1200, H=1600;
  const c = document.createElement("canvas"); c.width=W; c.height=H;
  const x = c.getContext("2d"); x.drawImage(img,0,0);
  const id = x.getImageData(0,0,W,H), d = id.data;
  // Igual que _ojos_tinte en motor.py (stage20 fix D): el disco cálido de
  // la mitad inferior del iris (tono 20-70) y el borde grisáceo no entraban
  // en la máscara verde y quedaban ámbar/grises con cualquier color pedido.
  // Aquí se tiñen con su propia escala (destino / media del disco).
  const N=W*H, masc=new Uint8Array(N), cal=new Uint8Array(N), mxA=new Uint8Array(N);
  let sr=0, sg=0, sb=0, n=0, sy=0, bx0=W, by0=H, bx1=0, by1=0;
  for (let p=0;p<N;p++){
    const i=p*4, r=d[i], g=d[i+1], b=d[i+2], a=d[i+3];
    if (a<=100) continue;
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b), df=mx-mn;
    mxA[p]=mx;
    if (df<=12) continue;
    let h; if (mx===r) h=((g-b)/df*60+360)%360; else if (mx===g) h=(b-r)/df*60+120; else h=(r-g)/df*60+240;
    if (h>=85 && h<=205 && mx<200){
      masc[p]=1; sr+=r; sg+=g; sb+=b; n++;
      const px=p%W, py=(p/W)|0; sy+=py;
      if (px<bx0) bx0=px; if (px>bx1) bx1=px; if (py<by0) by0=py; if (py>by1) by1=py;
    } else if (h>=20 && h<70 && mx<220){
      cal[p]=1;
    }
  }
  if (!n){ _ojosCache[ck]=c; return c; }
  const dest = COL_OJOS[idx][1];
  const er=dest[0]/(sr/n), eg=dest[1]/(sg/n), eb=dest[2]/(sb/n);
  // Disco: píxeles cálidos a menos de 15 px de la máscara verde.
  const dil = dilatar(masc, W, H, Math.max(0,bx0-15), Math.max(0,by0-15), Math.min(W-1,bx1+15), Math.min(H-1,by1+15), 15);
  let dr=0, dg=0, db=0, nd=0;
  const disco = new Uint8Array(N);
  for (let p=0;p<N;p++) if (cal[p] && dil[p]){ disco[p]=1; dr+=d[p*4]; dg+=d[p*4+1]; db+=d[p*4+2]; nd++; }
  // Borde (rim): iris dilatado 6 px, tonos medios 75-220, mitad inferior, sin iris.
  const ycent = sy/n;
  const iris = new Uint8Array(N);
  for (let p=0;p<N;p++) if (masc[p]||disco[p]) iris[p]=1;
  const dil6 = dilatar(iris, W, H, Math.max(0,bx0-21), Math.max(0,by0-21), Math.min(W-1,bx1+21), Math.min(H-1,by1+21), 6);
  const rim = new Uint8Array(N);
  for (let p=0;p<N;p++){
    if (!dil6[p] || iris[p]) continue;
    if ((p/W|0)<=ycent) continue;
    const mx=mxA[p];
    if (d[p*4+3]>100 && mx>=75 && mx<220) rim[p]=1;
  }
  let er2=er, eg2=eg, eb2=eb;
  if (nd){ er2=dest[0]/(dr/nd); eg2=dest[1]/(dg/nd); eb2=dest[2]/(db/nd); }
  for (let p=0;p<N;p++){
    const i=p*4;
    if (masc[p]){ d[i]=Math.min(255,d[i]*er); d[i+1]=Math.min(255,d[i+1]*eg); d[i+2]=Math.min(255,d[i+2]*eb); }
    else if (disco[p]||rim[p]){ d[i]=Math.min(255,d[i]*er2); d[i+1]=Math.min(255,d[i+1]*eg2); d[i+2]=Math.min(255,d[i+2]*eb2); }
  }
  x.putImageData(id,0,0);
  _ojosCache[ck]=c; return c;
}
function dilatar(mask, W, H, x0, y0, x1, y1, it){
  // Dilata mask it veces con un 3x3, solo dentro del bbox dado. No modifica mask.
  let cur = new Uint8Array(mask), nxt = new Uint8Array(W*H);
  for (let k=0;k<it;k++){
    nxt.set(cur);
    for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
      const i=y*W+x;
      if (cur[i]) continue;
      let on=false;
      for (let dy=-1;dy<=1 && !on;dy++){
        const yy=y+dy; if (yy<0||yy>=H) continue;
        for (let dx=-1;dx<=1;dx++){
          const xx=x+dx; if (xx<0||xx>=W) continue;
          if (cur[yy*W+xx]){ on=true; break; }
        }
      }
      if (on) nxt[i]=1;
    }
    const t=cur; cur=nxt; nxt=t;
  }
  return cur;
}
function componer(dest){
  const x = dest.getContext("2d"); x.clearRect(0,0,1200,1600);
  const S = R.sexo, piel = PIEL[R.piel][1], cp = COL_PELO[R.color_pelo][1], cr = COL_ROPA[R.color_ropa][1];
  const pelo = ARCH.pelo(R.pelo);
  // EDAD: con Anciano (edad 1) se usan la Base anciana v9 y el juego de
  // pelos grises v11 (gris TOTAL horneado en la capa). El tinte de pelo NO
  // se aplica al pelo anciano: va en (1,1,1), porque el tinte Silver no
  // funciona sobre el gris horneado (lo ensucia) y cualquier otro tinte lo
  // recolorearía. El vello facial (solo hombre) también tiene versión
  // anciana gris v11.1 (FacialHair<N>_Elderly) y sigue el mismo criterio:
  // con Anciano va la capa _Elderly y el tinte en (1,1,1).
  const anc = R.edad===1;
  const suf = anc ? "_Elderly" : "";
  const tintePelo = anc ? [1,1,1] : cp;
  x.drawImage(teñida(imgs[S+"/"+pelo+"_Back"+suf], tintePelo),0,0);
  x.drawImage(teñida(imgs[S+"/Base"+suf], piel),0,0);
  x.drawImage(teñida(imgs[S+"/"+ARCH.ropa(R.ropa)], cr),0,0);
  x.drawImage(teñida(imgs[S+"/"+ARCH.nariz(R.nariz)], piel),0,0);   // la nariz sigue la piel
  x.drawImage(ojosTeñidos(S+"/"+ARCH.ojos(R.ojos)),0,0);
  x.drawImage(imgs[S+"/"+ARCH.boca(R.boca,S)],0,0);
  if (S==="Male" && R.vello>0) x.drawImage(teñida(imgs[S+"/FacialHair"+R.vello+suf], tintePelo),0,0);
  x.drawImage(teñida(imgs[S+"/"+pelo+"_Front"+suf], tintePelo),0,0);
}
function codigo(){
  const s = R.sexo==="Female"?"F":"M";
  // Marcador de edad: AG1 = Joven, AG2 = Anciano. Va al final del código,
  // después de EC (y de FH en el hombre), y se lee igual en web, motor.py
  // y Unity (PortraitRecipe.ComboCode). 0 = Joven, 1 = Anciano en la receta.
  return `${s} H${R.pelo+1} O${R.ropa+1} E${R.ojos+1} N${R.nariz+1} M${R.boca+1} | HC${R.color_pelo+1} ST${R.piel+1} OC${R.color_ropa+1} EC${R.color_ojos+1}` + (s==="M" ? ` FH${R.vello}` : "") + ` AG${R.edad+1}`;
}
const FILAS = [
  ["AGE","edad",()=>EDADES], ["HAIR","pelo",()=>PELOS[R.sexo]], ["OUTFIT","ropa",()=>ROPAS[R.sexo]], ["EYES","ojos",()=>OJOS], ["EYE COLOR","color_ojos",()=>COL_OJOS.map(c=>c[0])],
  ["NOSE","nariz",()=>NARICES], ["MOUTH","boca",()=>BOCAS[R.sexo]], ["FACIAL HAIR","vello",()=>R.sexo==="Male"?VELLO:["—"]],
  ["HAIR COLOR","color_pelo",()=>COL_PELO.map(c=>c[0])], ["SKIN TONE","piel",()=>PIEL.map(c=>c[0])],
  ["OUTFIT COLOR","color_ropa",()=>COL_ROPA.map(c=>c[0])] ];
const COLOR_FILAS = { color_pelo: COL_PELO, piel: PIEL, color_ropa: COL_ROPA, color_ojos: COL_OJOS };
function construirFilas(){
  const cont = document.getElementById("filas"); cont.innerHTML="";
  for (const [etq, clave, lista] of FILAS){
    const d = document.createElement("div"); d.className="fila"+(FIJOS[clave]?" fijo":"");
    const fijo = FIJOS[clave];
    d.innerHTML = `<span class="etq">${etq}</span><button data-k="${clave}" data-d="-1">&lt;</button><b id="v_${clave}"></b><button data-k="${clave}" data-d="1">&gt;</button><button class="candado${fijo?" fijo":""}" data-candado="${clave}" title="${fijo?"Locked — Randomize will skip this trait. Click to unlock.":"Lock this trait — Randomize will skip it."}">${fijo?"🔒":"🔓"}</button>`;
    cont.appendChild(d);
    if (COLOR_FILAS[clave]){
      const m = document.createElement("div");
      m.style.cssText = "display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 8px 8px;";
      COLOR_FILAS[clave].forEach((c,i)=>{
        const b = document.createElement("button");
        const rgb = clave==="color_ojos" ? (c[1]||[95,165,115]) : c[1].map(v=>Math.round(v*255));
        b.style.cssText = `width:22px;height:22px;border-radius:4px;cursor:pointer;background:rgb(${rgb[0]},${rgb[1]},${rgb[2]});border:2px solid ${R[clave]===i?"#ffd65a":"rgba(255,255,255,.25)"}`;
        b.title = c[0];
        b.onclick = ()=>{ R[clave]=i; dibujar(); };
        m.appendChild(b);
      });
      cont.appendChild(m);
    }
  }
  // Solo los botones < > llevan el handler de ciclo: los cuadritos de
  // color y los candados tienen su propio onclick y no tienen data-k.
  // (Antes se reasignaba el onclick a TODOS los botones y al hacer clic
  // en un cuadrito de color se rompía: FILAS.find(...) daba undefined.)
  cont.querySelectorAll("button[data-k]").forEach(b=>b.onclick=()=>{ const k=b.dataset.k, n=FILAS.find(f=>f[1]===k)[2]().length;
    R[k]=(R[k]+parseInt(b.dataset.d)+n)%n; dibujar(); });
  cont.querySelectorAll("button[data-candado]").forEach(b=>b.onclick=()=>{ const k=b.dataset.candado;
    FIJOS[k]=!FIJOS[k]; dibujar(); });
  document.getElementById("btnF").className = R.sexo==="Female"?"activo":"";
  document.getElementById("btnM").className = R.sexo==="Male"?"activo":"";
}
function limitar(){
  // Al cambiar de sexo (o cargar una receta de otro sexo) los índices de
  // piezas deben quedar dentro de las listas de ese sexo: la mujer tiene
  // 12 pelos y 5 bocas, el hombre 4 pelos y 3 bocas. Sin esto, cambiar de
  // Female H12 a Male dejaba R.pelo=11 y el código mostraba "H12" mientras
  // el pelo desaparecía (no existe Hair12 en Male). Igual que el fix de
  // ClampRecipeToData en Unity (PortraitCreator.cs, stage20).
  // La edad (0 Joven / 1 Anciano) vale para los dos sexos; una receta vieja
  // sin "edad" deja R.edad como estaba (undefined|0 = 0, Joven).
  R.edad=Math.min(Math.max(R.edad|0,0), 1);
  R.pelo=Math.min(Math.max(R.pelo|0,0), PELOS[R.sexo].length-1);
  R.boca=Math.min(Math.max(R.boca|0,0), BOCAS[R.sexo].length-1);
  R.ropa=Math.min(Math.max(R.ropa|0,0), 2);
  R.ojos=Math.min(Math.max(R.ojos|0,0), 4);
  R.nariz=Math.min(Math.max(R.nariz|0,0), 2);
  if (R.sexo==="Female") R.vello=0; else R.vello=Math.min(Math.max(R.vello|0,0), 3);
}
function dibujar(){
  limitar();
  construirFilas();
  for (const [,clave,lista] of FILAS) document.getElementById("v_"+clave).textContent = lista()[R[clave]];
  componer(document.getElementById("lienzo"));
  document.getElementById("codigo").textContent = (contador?`#${contador}  `:"") + codigo();
}
function exportar(cara){
  const c = document.createElement("canvas"); c.width=1200; c.height=cara?1200:1600;
  const x = c.getContext("2d");
  const tmp = document.createElement("canvas"); tmp.width=1200; tmp.height=1600;
  R_temp = R; componer(tmp);
  x.drawImage(tmp,0,0);
  const a = document.createElement("a");
  a.download = (R.sexo.toLowerCase()) + (cara?"_face.png":"_portrait.png");
  a.href = c.toDataURL("image/png"); a.click();
  document.getElementById("estado").textContent = "Exportado: " + a.download;
}
document.getElementById("btnF").onclick = ()=>{ R.sexo="Female"; R.boca=Math.min(R.boca,4); dibujar(); };
document.getElementById("btnM").onclick = ()=>{ R.sexo="Male"; R.boca=Math.min(R.boca,2); dibujar(); };
document.getElementById("btnAzar").onclick = ()=>{ const r=(n)=>Math.floor(Math.random()*n);
  // Los rasgos fijados (candado) NO se tocan: solo se aleatorizan los demás.
  if(!FIJOS.edad) R.edad=r(2);
  if(!FIJOS.pelo) R.pelo=r(PELOS[R.sexo].length);
  if(!FIJOS.ropa) R.ropa=r(3);
  if(!FIJOS.ojos) R.ojos=r(5);
  if(!FIJOS.nariz) R.nariz=r(3);
  if(!FIJOS.boca) R.boca=r(BOCAS[R.sexo].length);
  if(!FIJOS.color_pelo) R.color_pelo=r(COL_PELO.length);
  if(!FIJOS.piel) R.piel=r(4);
  if(!FIJOS.color_ropa) R.color_ropa=r(COL_ROPA.length);
  if(!FIJOS.color_ojos) R.color_ojos=r(COL_OJOS.length);
  if(R.sexo==="Male" && !FIJOS.vello) R.vello=r(4);
  contador++; dibujar(); };
document.getElementById("btnReset").onclick = ()=>{
  // Vuelve al personaje por defecto (mujer, todo en 1) y quita TODOS los
  // candados, como al abrir el programa por primera vez.
  R = { sexo:"Female", edad:0, pelo:0, ropa:0, ojos:0, nariz:0, boca:0, color_pelo:0, piel:0, color_ropa:0, color_ojos:0, vello:0 };
  FIJOS = {};
  contador = 0;
  dibujar();
  document.getElementById("estado").textContent = "Restored to default.";
};
document.getElementById("btnExportar").onclick = ()=>exportar(false);
document.getElementById("btnCara").onclick = ()=>exportar(true);
document.getElementById("btnGuardar").onclick = ()=>{
  const a=document.createElement("a");
  a.download = R.sexo.toLowerCase()+"_recipe.json";
  a.href = "data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(R,null,2)); a.click(); };
document.getElementById("btnCargar").onclick = ()=>document.getElementById("archivoReceta").click();
document.getElementById("archivoReceta").onchange = (e)=>{
  const f=e.target.files[0]; if(!f) return;
  f.text().then(t=>{ try{ R=Object.assign(R, JSON.parse(t)); dibujar(); }catch(_){} }); };
precargar();
</script>
</body>
</html>
